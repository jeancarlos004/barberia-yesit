services:
  - type: web
    name: barberia-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: neondb
          property: connectionString
      - key: ALLOWED_HOSTS
        value: barberia-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://barberia-frontend.vercel.app

databases:
  - name: neondb
    databaseName: neondb
    user: neondb_owner
